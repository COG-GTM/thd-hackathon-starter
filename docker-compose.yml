version: '3'
services:
  api:
    build:
      context: ./api
      dockerfile: dockerfile.dev
    ports:
      - "3002:3002"
      - "56745:56745"
    volumes:
      - ./api:/api
      - /api/node_modules
    environment:
      mongoUrl: mongodb://${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME in .env}:${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD in .env}@mongo/my_database?authSource=admin
    depends_on:
      - db
  db:
    container_name: mongo
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD in .env}
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
  ui:
    build:
      context: ./ui
      dockerfile: dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./ui:/ui
      - /ui/node_modules
volumes:
  mongo-data:
