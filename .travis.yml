language: node_js
node_js:
  - 22
services:
  - mongodb
cache:
  directories:
    - "$HOME/.cache/yarn"
before_script:
  - mongo mydb_test --eval 'db.createUser({user:"travis",pwd:"test",roles:["readWrite"]})'
install:
  - npm install -g codecov
matrix:
  include:
    - name: API Pipeline
      env: PACKAGE_LOCATION=api
    - name: UI Pipeline
      env: PACKAGE_LOCATION=ui
script:
  - cd $PACKAGE_LOCATION
  - yarn install
  - yarn test
  - codecov -F $PACKAGE_LOCATION
  - yarn build
