name: container-image

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: api/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test
        env:
          mongoUrl: mongodb://localhost:27017/test

  test-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: ui/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test --watchAll=false
        env:
          CI: "true"

  image:
    needs: [test-api, test-ui]
    runs-on: ubuntu-latest
    env:
      INTERNAL_REGISTRY: ${{ secrets.INTERNAL_REGISTRY }}
      IMAGE_NAME: thd-hackathon-starter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Log in to the internal registry
        if: github.event_name == 'push' && env.INTERNAL_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.INTERNAL_REGISTRY }}
          username: ${{ secrets.INTERNAL_REGISTRY_USERNAME }}
          password: ${{ secrets.INTERNAL_REGISTRY_PASSWORD }}
      - name: Push to the internal registry
        if: github.event_name == 'push' && env.INTERNAL_REGISTRY != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.INTERNAL_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
