# Production-shaped stack for the platform migration: the single app image plus MongoDB.
# Usage: export COOKIE_SIGNING_KEY=...; docker compose -f docker-compose.migration.yml up --build
services:
  app:
    build: .
    image: thd-hackathon-starter:migration
    ports:
      - "8080:8080"
    environment:
      mongoUrl: mongodb://mongo:27017/my_database
      cookieSigningKey: ${COOKIE_SIGNING_KEY:?set COOKIE_SIGNING_KEY in the environment}
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:7.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
